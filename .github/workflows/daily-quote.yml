name: Daily Morning Quote

on:
  schedule:
    # 10:00 AM KST = 01:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch: # allow manual trigger for testing

jobs:
  send-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily inspirational quote
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: thjung91@gmail.com
        run: |
          pip install anthropic --quiet

          python3 << 'EOF'
          import anthropic
          import smtplib
          import os
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime

          client = anthropic.Anthropic(api_key=os.environ["ANTHROPIC_API_KEY"])

          message = client.messages.create(
              model="claude-opus-4-7",
              max_tokens=512,
              messages=[{
                  "role": "user",
                  "content": (
                      "Give me one powerful, aspirational, inspirational quote to start the day "
                      "feeling pumped and ready to go. "
                      "It can be from absolutely anywhere — a movie, book, speech, interview, "
                      "song, podcast, conversation, article, TV show, anything. "
                      "Pick something that feels fresh and genuinely motivating, not the same "
                      "overused quotes everyone has seen a thousand times. "
                      "Vary the source type each day (sometimes a film character, sometimes a "
                      "scientist, sometimes an athlete, sometimes a fictional book character, etc). "
                      "Format your response EXACTLY like this, nothing else:\n\n"
                      "QUOTE: [the quote]\n"
                      "SOURCE: [who said it / where it's from]\n"
                      "CONTEXT: [one sentence on why this quote hits hard today]"
                  )
              }]
          )

          raw = message.content[0].text.strip()

          quote = ""
          source = ""
          context = ""
          for line in raw.splitlines():
              if line.startswith("QUOTE:"):
                  quote = line[len("QUOTE:"):].strip()
              elif line.startswith("SOURCE:"):
                  source = line[len("SOURCE:"):].strip()
              elif line.startswith("CONTEXT:"):
                  context = line[len("CONTEXT:"):].strip()

          today = datetime.now().strftime("%A, %B %d")

          html_body = f"""
          <html>
          <body style="font-family: Georgia, serif; background: #0f0f0f; margin: 0; padding: 0;">
            <table width="100%" cellpadding="0" cellspacing="0" style="background: #0f0f0f; padding: 40px 0;">
              <tr>
                <td align="center">
                  <table width="600" cellpadding="0" cellspacing="0" style="background: #1a1a1a; border-radius: 12px; overflow: hidden;">
                    <tr>
                      <td style="background: linear-gradient(135deg, #f5a623, #f76b1c); padding: 24px 40px;">
                        <p style="margin: 0; color: #fff; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; font-family: Arial, sans-serif;">Good Morning &bull; {today}</p>
                        <h1 style="margin: 8px 0 0; color: #fff; font-size: 22px; font-weight: bold; font-family: Arial, sans-serif;">Your Daily Fuel &#9889;</h1>
                      </td>
                    </tr>
                    <tr>
                      <td style="padding: 48px 40px 32px;">
                        <p style="font-size: 26px; line-height: 1.55; color: #f0e6d3; margin: 0 0 32px; font-style: italic;">
                          &ldquo;{quote}&rdquo;
                        </p>
                        <p style="font-size: 15px; color: #f5a623; margin: 0 0 24px; font-weight: bold; font-family: Arial, sans-serif; letter-spacing: 0.5px;">
                          &mdash; {source}
                        </p>
                        <hr style="border: none; border-top: 1px solid #333; margin: 0 0 24px;" />
                        <p style="font-size: 14px; color: #888; line-height: 1.6; margin: 0; font-family: Arial, sans-serif;">
                          {context}
                        </p>
                      </td>
                    </tr>
                    <tr>
                      <td style="padding: 16px 40px 32px;">
                        <p style="font-size: 13px; color: #555; margin: 0; font-family: Arial, sans-serif; text-align: center;">
                          Go get it. &#128293;
                        </p>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </body>
          </html>
          """

          plain_body = f'"{quote}"\n\n— {source}\n\n{context}\n\nGo get it.'

          msg = MIMEMultipart("alternative")
          msg["Subject"] = f"☀️ Your Morning Quote — {today}"
          msg["From"] = os.environ["GMAIL_USER"]
          msg["To"] = os.environ["RECIPIENT_EMAIL"]
          msg.attach(MIMEText(plain_body, "plain"))
          msg.attach(MIMEText(html_body, "html"))

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login(os.environ["GMAIL_USER"], os.environ["GMAIL_APP_PASSWORD"])
              server.sendmail(
                  os.environ["GMAIL_USER"],
                  os.environ["RECIPIENT_EMAIL"],
                  msg.as_string()
              )

          print(f"Quote sent successfully!")
          print(f"Quote: {quote}")
          print(f"Source: {source}")
          EOF
