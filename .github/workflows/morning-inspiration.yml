name: Daily Morning Inspiration

on:
  schedule:
    - cron: '0 1 * * *'  # 1am UTC = 10am KST (UTC+9)
  workflow_dispatch:      # Manual trigger for testing

jobs:
  morning-quote:
    runs-on: ubuntu-latest

    steps:
      - name: Generate quote and send email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, smtplib, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from datetime import datetime

          # ---------- Generate quote via Claude API ----------
          payload = json.dumps({
              "model": "claude-haiku-4-5-20251001",
              "max_tokens": 400,
              "messages": [{
                  "role": "user",
                  "content": (
                      "Give me one powerful, aspirational quote that will make someone feel "
                      "pumped and ready to conquer their day. "
                      "The quote can be from ANYTHING: movies, books, speeches, articles, "
                      "interviews, songs, podcasts, TV shows — athletes, philosophers, artists, "
                      "entrepreneurs, scientists, coaches, fictional characters, anyone. "
                      "Mix it up and surprise me — don't always reach for the most famous quotes. "
                      "Sometimes dig deeper into something unexpected and special.\n\n"
                      "Respond with ONLY this format, nothing else:\n"
                      "\"The quote text here.\"\n"
                      "— Person Name, Source"
                  )
              }]
          }).encode()

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=payload,
              headers={
                  "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                  "anthropic-version": "2023-06-01",
                  "content-type": "application/json",
              },
          )
          with urllib.request.urlopen(req) as resp:
              quote = json.loads(resp.read())["content"][0]["text"].strip()

          print(f"Quote:\n{quote}\n")

          # ---------- Build email ----------
          today = datetime.utcnow().strftime("%B %d, %Y")

          # Escape HTML special chars in the quote
          import html as html_lib
          quote_html = html_lib.escape(quote).replace("\n", "<br>")

          html_body = f"""<!DOCTYPE html>
          <html lang="en">
          <body style="margin:0;padding:0;background:#f0ede8;font-family:Georgia,serif;">
            <div style="max-width:580px;margin:40px auto;padding:16px;">
              <div style="background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);border-radius:20px;padding:50px 40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
                <p style="color:#e2b96b;font-size:11px;letter-spacing:4px;text-transform:uppercase;margin:0 0 32px;font-family:Arial,sans-serif;">
                  Good Morning ☀️ &nbsp;·&nbsp; {today}
                </p>
                <div style="border-left:3px solid #e2b96b;margin:0 10px 36px;padding:20px 28px;text-align:left;background:rgba(255,255,255,0.06);border-radius:0 12px 12px 0;">
                  <p style="color:#ffffff;font-size:18px;line-height:1.85;font-style:italic;margin:0;">
                    {quote_html}
                  </p>
                </div>
                <p style="color:#8899aa;font-size:13px;margin:0;font-family:Arial,sans-serif;">
                  Go get it. Today is yours. 🔥
                </p>
              </div>
            </div>
          </body>
          </html>"""

          text_body = f"Good Morning!\n\n{quote}\n\nGo get it. Today is yours."

          msg = MIMEMultipart("alternative")
          msg["Subject"] = f"☀️ Morning Fuel · {today}"
          msg["From"] = f"Morning Boost <{os.environ['GMAIL_USERNAME']}>"
          msg["To"] = "thjung91@gmail.com"
          msg.attach(MIMEText(text_body, "plain"))
          msg.attach(MIMEText(html_body, "html"))

          # ---------- Send via Gmail SMTP ----------
          with smtplib.SMTP("smtp.gmail.com", 587) as server:
              server.ehlo()
              server.starttls()
              server.login(os.environ["GMAIL_USERNAME"], os.environ["GMAIL_APP_PASSWORD"])
              server.send_message(msg)

          print("Email sent successfully!")
          PYEOF
