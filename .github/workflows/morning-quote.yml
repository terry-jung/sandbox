name: ☀️ Morning Inspiration Quote

on:
  schedule:
    - cron: '0 1 * * *'  # 1:00 AM UTC = 10:00 AM KST (UTC+9)
  workflow_dispatch:       # Manual trigger for testing

jobs:
  send-quote:
    runs-on: ubuntu-latest

    steps:
      - name: Generate and send morning quote
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          pip install anthropic --quiet
          python3 << 'PYEOF'
          import anthropic
          import smtplib
          import os
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime

          client = anthropic.Anthropic(api_key=os.environ["ANTHROPIC_API_KEY"])

          message = client.messages.create(
              model="claude-opus-4-7",
              max_tokens=400,
              messages=[{
                  "role": "user",
                  "content": (
                      "Give me one powerful, aspirational, inspirational quote that will make someone "
                      "feel pumped and ready to conquer their day. "
                      "The quote can be from anywhere — a movie, book, speech, article, interview, "
                      "conversation, song, podcast, or any other source. "
                      "Pick something unexpected and powerful — avoid the most overused clichés. "
                      "Vary the source type day to day: sometimes a film line, sometimes a coach, "
                      "sometimes a musician, sometimes an athlete, sometimes a philosopher, etc. "
                      "Respond in EXACTLY this format and nothing else:\n\n"
                      "QUOTE: [the exact quote]\n"
                      "SOURCE: [who said it and where it's from]"
                  )
              }]
          )

          text = message.content[0].text.strip()
          quote = source = ""
          for line in text.splitlines():
              if line.startswith("QUOTE:"):
                  quote = line[len("QUOTE:"):].strip().strip('"')
              elif line.startswith("SOURCE:"):
                  source = line[len("SOURCE:"):].strip()

          if not quote or not source:
              raise ValueError(f"Unexpected response format:\n{text}")

          today = datetime.utcnow().strftime("%B %d, %Y")
          email_address = "thjung91@gmail.com"
          app_password = os.environ["GMAIL_APP_PASSWORD"]

          msg = MIMEMultipart("alternative")
          msg["Subject"] = f"Your Morning Fuel — {today}"
          msg["From"] = email_address
          msg["To"] = email_address

          plain = f'"{quote}"\n\n— {source}\n\nGo get it today.'

          html = f"""<!DOCTYPE html>
          <html>
          <body style="margin:0;padding:0;background:#f4f4f4;font-family:Georgia,serif;">
            <table width="100%" cellpadding="0" cellspacing="0">
              <tr><td align="center" style="padding:40px 20px;">
                <table width="560" cellpadding="0" cellspacing="0"
                       style="background:#fff;border-radius:12px;box-shadow:0 2px 24px rgba(0,0,0,0.08);">
                  <tr>
                    <td style="padding:40px 48px 32px;">
                      <p style="margin:0 0 28px;font-size:13px;color:#aaa;font-family:Arial,sans-serif;letter-spacing:0.05em;text-transform:uppercase;">
                        Good morning &nbsp;☀️ &nbsp;{today}
                      </p>
                      <blockquote style="margin:0 0 24px;padding:0 0 0 20px;
                                         border-left:4px solid #f5c518;
                                         font-size:22px;line-height:1.6;
                                         color:#1a1a1a;font-style:italic;">
                        &ldquo;{quote}&rdquo;
                      </blockquote>
                      <p style="margin:0 0 36px;font-size:15px;color:#555;font-family:Arial,sans-serif;">
                        &mdash; {source}
                      </p>
                      <hr style="border:none;border-top:1px solid #eee;margin:0 0 24px;">
                      <p style="margin:0;font-size:13px;color:#bbb;font-family:Arial,sans-serif;">
                        Go get it today.&nbsp; 🔥
                      </p>
                    </td>
                  </tr>
                </table>
              </td></tr>
            </table>
          </body>
          </html>"""

          msg.attach(MIMEText(plain, "plain"))
          msg.attach(MIMEText(html, "html"))

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login(email_address, app_password)
              server.sendmail(email_address, email_address, msg.as_string())

          print(f"Sent: \"{quote}\" — {source}")
          PYEOF
